name: docker-deploy

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          ./vendor/bin/pest

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Deploy container to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            IMAGE_TAG="sha-${{ github.sha }}"
            CONTAINER_NAME="${{ secrets.APP_CONTAINER_NAME }}"
            APP_PORT="${{ secrets.APP_LOCAL_PORT }}"
            ENV_FILE_PATH="${{ secrets.APP_ENV_FILE_PATH }}"
            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            MYSQL_CONTAINER_NAME="${{ secrets.MYSQL_CONTAINER_NAME }}"
            MYSQL_VOLUME_NAME="${{ secrets.MYSQL_VOLUME_NAME }}"
            DOCKER_NETWORK="${{ secrets.APP_DOCKER_NETWORK }}"
            MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
            MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}"
            MYSQL_USER="${{ secrets.MYSQL_USER }}"
            MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}"

            if [ -z "$CONTAINER_NAME" ]; then
              CONTAINER_NAME="coffee-shop-laravel"
            fi

            if [ -z "$APP_PORT" ]; then
              APP_PORT="8080"
            fi

            if [ -z "$MYSQL_CONTAINER_NAME" ]; then
              MYSQL_CONTAINER_NAME="coffee-shop-mysql"
            fi

            if [ -z "$MYSQL_VOLUME_NAME" ]; then
              MYSQL_VOLUME_NAME="coffee-shop-mysql-data"
            fi

            if [ -z "$DOCKER_NETWORK" ]; then
              DOCKER_NETWORK="coffee-shop-network"
            fi

            if [ -z "$ENV_FILE_PATH" ]; then
              echo "APP_ENV_FILE_PATH belum diset di GitHub Secrets."
              exit 1
            fi

            if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_USERNAME / GHCR_TOKEN belum diset di GitHub Secrets."
              exit 1
            fi

            if [ ! -f "$ENV_FILE_PATH" ]; then
              echo "File env tidak ditemukan: $ENV_FILE_PATH"
              exit 1
            fi

            if [ -z "$MYSQL_ROOT_PASSWORD" ] || [ -z "$MYSQL_DATABASE" ] || [ -z "$MYSQL_USER" ] || [ -z "$MYSQL_PASSWORD" ]; then
              echo "MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD wajib diset di GitHub Secrets."
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE_NAME:$IMAGE_TAG"
            docker pull mysql:8.4

            if ! docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1; then
              docker network create "$DOCKER_NETWORK"
            fi

            if docker ps -a --format '{{.Names}}' | grep -Eq "^$CONTAINER_NAME$"; then
              docker rm -f "$CONTAINER_NAME"
            fi

            if docker ps -a --format '{{.Names}}' | grep -Eq "^$MYSQL_CONTAINER_NAME$"; then
              docker rm -f "$MYSQL_CONTAINER_NAME"
            fi

            docker run -d \
              --name "$MYSQL_CONTAINER_NAME" \
              --restart unless-stopped \
              --network "$DOCKER_NETWORK" \
              -v "$MYSQL_VOLUME_NAME:/var/lib/mysql" \
              -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" \
              -e MYSQL_USER="$MYSQL_USER" \
              -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              mysql:8.4 \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci

            for i in $(seq 1 30); do
              if docker exec "$MYSQL_CONTAINER_NAME" mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent >/dev/null 2>&1; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "MySQL tidak ready setelah 60 detik."
                exit 1
              fi
              sleep 2
            done

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --network "$DOCKER_NETWORK" \
              --env-file "$ENV_FILE_PATH" \
              -e DB_HOST="$MYSQL_CONTAINER_NAME" \
              -e DB_PORT="3306" \
              -p "127.0.0.1:$APP_PORT:80" \
              "$IMAGE_NAME:$IMAGE_TAG"

            docker exec "$CONTAINER_NAME" php artisan migrate --force

            docker image prune -f
