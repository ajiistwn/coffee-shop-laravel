name: docker-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          ./vendor/bin/pest

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Deploy container to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            IMAGE_TAG="sha-${{ github.sha }}"
            CONTAINER_NAME="${{ secrets.APP_CONTAINER_NAME }}"
            APP_PORT="${{ secrets.APP_LOCAL_PORT }}"
            ENV_FILE_PATH="${{ secrets.APP_ENV_FILE_PATH }}"
            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"

            if [ -z "$CONTAINER_NAME" ]; then
              CONTAINER_NAME="coffee-shop-laravel"
            fi

            if [ -z "$APP_PORT" ]; then
              APP_PORT="8080"
            fi

            if [ -z "$ENV_FILE_PATH" ]; then
              echo "APP_ENV_FILE_PATH belum diset di GitHub Secrets."
              exit 1
            fi

            if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_USERNAME / GHCR_TOKEN belum diset di GitHub Secrets."
              exit 1
            fi

            if [ ! -f "$ENV_FILE_PATH" ]; then
              echo "File env tidak ditemukan: $ENV_FILE_PATH"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE_NAME:$IMAGE_TAG"

            if docker ps -a --format '{{.Names}}' | grep -Eq "^$CONTAINER_NAME$"; then
              docker rm -f "$CONTAINER_NAME"
            fi

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE_PATH" \
              -p "127.0.0.1:$APP_PORT:80" \
              "$IMAGE_NAME:$IMAGE_TAG"

            docker image prune -f
